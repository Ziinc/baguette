name: ios-spike

# Throwaway: boots plain OTP in the iOS simulator with fork() refused, as on a
# device. Runs on dispatch, and on pushes to claude/ios that touch it (a
# workflow must be on main before it can be dispatched).

on:
  workflow_dispatch:
  push:
    branches: [claude/ios]
    paths:
      - scripts/build-liberlang-ios.sh
      - scripts/ios-spike/**
      - .github/workflows/ios-spike.yml

env:
  OTP_TAG: OTP-29.1.2
  LANG: C.UTF-8

jobs:
  spike:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The host OTP: erl/erlc for the cross build, and the release's code.
      # Same cache as ci.yml's macOS job.
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: |
            ~/liberlang/liberlang.a
            ~/liberlang/otp
          key: liberlang-macos-aarch64-${{ env.OTP_TAG }}-${{ hashFiles('scripts/build-liberlang.sh') }}
      - name: Build host OTP
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: brew install openssl@3 && scripts/build-liberlang.sh "$OTP_TAG" ~/liberlang && rm -rf ~/liberlang/src
      - run: echo "$HOME/liberlang/otp/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        id: liberlang-ios
        with:
          path: ~/liberlang-ios/liberlang.a
          key: liberlang-ios-sim-${{ env.OTP_TAG }}-${{ hashFiles('scripts/build-liberlang-ios.sh') }}
      - name: Build liberlang for the iOS simulator
        if: steps.liberlang-ios.outputs.cache-hit != 'true'
        run: scripts/build-liberlang-ios.sh "$OTP_TAG" sim ~/liberlang-ios
      - name: Boot OTP in the simulator
        run: scripts/ios-spike/run.sh ~/liberlang-ios ~/liberlang/otp/lib/erlang
        timeout-minutes: 15
      - name: Configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: otp-ios-config-logs
          path: |
            ~/liberlang-ios/otp/erts/*/config.log
            ~/liberlang-ios/otp/lib/crypto/c_src/*/Makefile
          if-no-files-found: ignore
