name: Release

# Pushing a `v*` tag runs CI and the Android build, then publishes the Firehose
# demo's builds as a GitHub release: Linux (.deb, AppImage), macOS (.dmg for
# Apple silicon and Intel) and Android (signed APK and AAB). The release also
# carries Baguette's precompiled NIFs and hosts, which apps download (nif.yml,
# host.yml).
#
# Running it by hand (workflow_dispatch) is a dry run: everything is built and
# kept as the run's artifacts, with the host checksums in its summary, but
# nothing is published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  nif:
    uses: ./.github/workflows/nif.yml

  host:
    uses: ./.github/workflows/host.yml

  publish:
    needs: [ci, android, nif, host]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firehose-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@v4
        with:
          pattern: nif-*
          merge-multiple: true
          path: assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The emulator's debug APK is a test build, not a release.
          rm -f assets/firehose.apk
          find assets -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" --generate-notes
