name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  OTP_TAG: OTP-29.1.2
  ELIXIR_VERSION: "1.20.4"
  LANG: C.UTF-8

jobs:
  elixir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Only main writes the cache; branches read it, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - run: mix compile --warnings-as-errors
      - run: mix test
      # Files levain also holds, which its own tests check: the patch and
      # component fixtures, the component manifest and the host's events.
      - name: Fixtures match levain
        run: |
          rev=$(sed -n 's/^levain = { git = "[^"]*", rev = "\([0-9a-f]*\)".*/\1/p' native/baguette_host/Cargo.toml)
          test -n "$rev"
          git init -q /tmp/levain
          git -C /tmp/levain fetch -q --depth 1 https://github.com/Ziinc/levain "$rev"
          git -C /tmp/levain checkout -q FETCH_HEAD
          status=0
          for pair in test/fixtures/patches.json:fixtures/patches.json \
                      test/fixtures/components.json:fixtures/components.json \
                      test/fixtures/events.json:fixtures/events.json \
                      test/fixtures/calls.json:fixtures/calls.json \
                      priv/components/gpui-kit.json:components/gpui-kit.json; do
            diff -u "/tmp/levain/${pair#*:}" "${pair%%:*}" || status=1
          done
          exit $status
      - name: Example tests
        run: |
          for example in examples/*/; do
            (cd "$example" && mix deps.get && mix format --check-formatted && mix test)
          done

  native:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Only main writes the cache; branches read it, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p baguette_host --all-targets --features playwright -- -D warnings
      # baguette_ios is the host bundled as a static library for Xcode: no
      # tests, and building it here only spends the runner's disk.
      - run: cargo test --workspace --exclude baguette_ios

  # Lint rules (ast-grep, native/lint), spelling, unused dependencies and the
  # dependency policy (native/deny.toml). None of it compiles the workspace,
  # so no system libraries. Every check runs even if an earlier one fails.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install typos, cargo-machete and cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: typos@1.52.2,cargo-machete@0.9.2,cargo-deny@0.20.2
      - name: Install ast-grep
        run: npm install --global @ast-grep/cli@0.38.7
      - name: typos
        if: ${{ !cancelled() }}
        run: typos
      # The rules' own tests (native/lint/ast-grep/__tests__), then the rules
      # over the native crates.
      - name: ast-grep test
        if: ${{ !cancelled() }}
        working-directory: native
        run: ast-grep test
      - name: ast-grep scan
        if: ${{ !cancelled() }}
        working-directory: native
        run: ast-grep scan
      - name: cargo machete
        if: ${{ !cancelled() }}
        working-directory: native
        run: cargo machete
      - name: cargo deny
        if: ${{ !cancelled() }}
        working-directory: native
        run: cargo deny --locked check

  e2e-linux:
    # The counter as a real `mix release`: the host links liberlang built from
    # the same OTP the release ships, so both share one ERTS. Like the other
    # platforms' example runs, pull requests skip it: merges to main, release
    # tags and manual runs run it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # The runner's preinstalled toolchains leave too little disk for the
      # host's release build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Only main writes the cache; branches read it, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # npm's download cache: Tauri's CLI, from `npm install` (Android) and
      # `npx @tauri-apps/cli` (desktop bundles).
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/baguette_host/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang libncurses-dev fonts-dejavu xvfb openbox xdotool \
            imagemagick python3-gi at-spi2-core gir1.2-atspi-2.0 libfuse2t64 file
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: |
            ~/liberlang/liberlang.a
            ~/liberlang/otp
          key: liberlang-${{ runner.os }}-${{ env.OTP_TAG }}-${{ hashFiles('scripts/build-liberlang.sh') }}
      - name: Build liberlang and OTP
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: scripts/build-liberlang.sh "$OTP_TAG" ~/liberlang && rm -rf ~/liberlang/src
      - name: Elixir
        run: |
          curl -fsSL -o /tmp/elixir.zip \
            "https://github.com/elixir-lang/elixir/releases/download/v$ELIXIR_VERSION/elixir-otp-29.zip"
          mkdir -p ~/elixir && unzip -q /tmp/elixir.zip -d ~/elixir
          echo "$HOME/liberlang/otp/bin" >> "$GITHUB_PATH"
          echo "$HOME/elixir/bin" >> "$GITHUB_PATH"
          echo "BAGUETTE_LIBERLANG=$HOME/liberlang" >> "$GITHUB_ENV"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Counter release, clicked through AT-SPI
        run: scripts/e2e-linux.sh e2e-screenshots
        timeout-minutes: 20
      - name: Releases with gpui-playwright, driven from ExUnit
        # TAO reads the colour scheme from the XDG desktop portal over the
        # session bus, 5 s per call, and the runner's portal never answers:
        # each app took 35 s to start. With no bus to reach, it falls back
        # at once.
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent/bus
        run: |
          for app in counter board todo gallery; do
            (cd examples/$app && mix deps.get && \
              BAGUETTE_HOST_FEATURES=playwright MIX_ENV=prod mix release --overwrite)
          done
          mix deps.get
          xvfb-run -a mix test --only playwright
        # Most of it is building each example's host with Cargo.
        timeout-minutes: 45
      - name: Tauri bundles (deb, AppImage) install and boot the release
        run: scripts/bundle-test-linux.sh examples/broadway Firehose bundle-test
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            e2e-screenshots
            bundle-test
      - uses: actions/upload-artifact@v4
        with:
          name: firehose-linux-bundles
          path: |
            examples/broadway/_build/prod/bundle/deb/*.deb
            examples/broadway/_build/prod/bundle/appimage/*.AppImage

  windows:
    # Pull requests skip it, as they do macOS: Windows runners are slow.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/windows.yml

  macos:
    # The Firehose disk image, mounted and booted as a user gets it. Signed
    # and notarized when the repository has Tauri's APPLE_* secrets. Pull
    # requests skip it; merges to main, release tags and release.yml's dry
    # run (whose assets include the disk images) run it.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Only main writes the cache; branches read it, so they never evict it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # npm's download cache: Tauri's CLI, from `npm install` (Android) and
      # `npx @tauri-apps/cli` (desktop bundles).
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/baguette_host/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: |
            ~/liberlang/liberlang.a
            ~/liberlang/otp
          key: liberlang-macos-${{ matrix.arch }}-${{ env.OTP_TAG }}-${{ hashFiles('scripts/build-liberlang.sh') }}
      - name: Build liberlang and OTP
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: brew install openssl@3 && scripts/build-liberlang.sh "$OTP_TAG" ~/liberlang && rm -rf ~/liberlang/src
      - name: Elixir
        run: |
          curl -fsSL -o /tmp/elixir.zip \
            "https://github.com/elixir-lang/elixir/releases/download/v$ELIXIR_VERSION/elixir-otp-29.zip"
          mkdir -p ~/elixir && unzip -q /tmp/elixir.zip -d ~/elixir
          echo "$HOME/liberlang/otp/bin" >> "$GITHUB_PATH"
          echo "$HOME/elixir/bin" >> "$GITHUB_PATH"
          echo "BAGUETTE_LIBERLANG=$HOME/liberlang" >> "$GITHUB_ENV"
      - run: mix local.hex --force && mix local.rebar --force
      - name: Disk image installs and boots the release
        run: |
          # Tauri signs when these are set at all, so drop the empty ones.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          scripts/bundle-test-macos.sh examples/broadway bundle-test
        timeout-minutes: 30
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-bundle-test-${{ matrix.arch }}
          path: bundle-test
      - uses: actions/upload-artifact@v4
        with:
          name: firehose-macos-${{ matrix.arch }}
          path: examples/broadway/_build/prod/bundle/dmg/*.dmg
