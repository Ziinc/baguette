name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  elixir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  host-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native/baguette_host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/baguette_host
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build
