name: NIF

# Builds Baguette's NIF (native/baguette_nif) for each target in
# Baguette.Native.Precompiled, named as rustler_precompiled downloads it:
# lib<crate>-v<version>-nif-<nif>-<target>.<ext>.tar.gz. The release
# workflow attaches them to the version's GitHub release.

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    env:
      # rustler_precompiled's default: one build serves NIF 2.15 and later.
      NIF_VERSION: "2.15"
      RUSTLER_NIF_VERSION: "2.15"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: native
        run: cargo build --release -p baguette_nif --target ${{ matrix.target }}
      - name: Package
        run: |
          version=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs)
          dir=native/target/${{ matrix.target }}/release
          case "${{ matrix.target }}" in
            *windows*) built=baguette_nif.dll; name=baguette_nif; ext=dll ;;
            *darwin*) built=libbaguette_nif.dylib; name=libbaguette_nif; ext=so ;;
            *) built=libbaguette_nif.so; name=libbaguette_nif; ext=so ;;
          esac
          file="$name-v$version-nif-$NIF_VERSION-${{ matrix.target }}.$ext"
          mkdir -p out
          cp "$dir/$built" "out/$file"
          tar -czf "out/$file.tar.gz" -C out "$file"
          rm "out/$file"
      - uses: actions/upload-artifact@v4
        with:
          name: nif-${{ matrix.target }}
          path: out/*.tar.gz
