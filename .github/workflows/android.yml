name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  OTP_TAG: OTP-29.1.2
  NDK_VERSION: 27.2.12479018
  LANG: C.UTF-8

jobs:
  firehose:
    # The acceptance test: the Broadway demo as an APK on an x86_64 emulator
    # (KVM is available on GitHub's Linux runners).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: ~/liberlang-android/x86_64-linux-android
          key: liberlang-android-x86_64-${{ env.OTP_TAG }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-liberlang-android.sh') }}
      - name: Cross-build OTP for Android
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: |
          scripts/build-liberlang-android.sh "$OTP_TAG" x86_64 ~/liberlang-build
          mkdir -p ~/liberlang-android/x86_64-linux-android
          cp ~/liberlang-build/{liberlang.so,erl_child_setup,inet_gethost} ~/liberlang-android/x86_64-linux-android/
      - name: Build the Firehose APK
        working-directory: examples/broadway
        env:
          BAGUETTE_ANDROID: x86_64
          MIX_ENV: prod
        run: |
          export BAGUETTE_LIBERLANG=$HOME/liberlang-android
          mix local.hex --force && mix local.rebar --force
          mix deps.get
          mix release --overwrite
          cp _build/prod/android/firehose.apk "$RUNNER_TEMP/firehose.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: firehose-apk
          path: ${{ runner.temp }}/firehose.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android-smoke.sh ${{ runner.temp }}/firehose.apk android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke

  phone:
    # A signed release build for arm64 phones: an APK to install by hand and
    # an AAB for Google Play (not run here). Signed with the ANDROID_KEYSTORE
    # secret when the repository has one, else with a throwaway key.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
          workspaces: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: ~/liberlang-android/aarch64-linux-android
          key: liberlang-android-arm64-${{ env.OTP_TAG }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-liberlang-android.sh') }}
      - name: Cross-build OTP for Android
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: |
          scripts/build-liberlang-android.sh "$OTP_TAG" arm64 ~/liberlang-build
          mkdir -p ~/liberlang-android/aarch64-linux-android
          cp ~/liberlang-build/{liberlang.so,erl_child_setup,inet_gethost} ~/liberlang-android/aarch64-linux-android/
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore=$RUNNER_TEMP/release.jks
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE secret: signing with a throwaway key, which Google Play will not accept."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16) KEY_ALIAS=throwaway
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Baguette CI"
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "BAGUETTE_ANDROID_KEYSTORE=$keystore"
            echo "BAGUETTE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BAGUETTE_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "BAGUETTE_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build the signed Firehose APK and AAB
        working-directory: examples/broadway
        env:
          BAGUETTE_ANDROID: arm64
          MIX_ENV: prod
        run: |
          export BAGUETTE_LIBERLANG=$HOME/liberlang-android
          mix local.hex --force && mix local.rebar --force
          mix deps.get
          mix release --overwrite
          cp _build/prod/android/firehose.apk "$RUNNER_TEMP/firehose-arm64.apk"
          cp _build/prod/android/firehose.aab "$RUNNER_TEMP/firehose-arm64.aab"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$RUNNER_TEMP/firehose-arm64.apk"
          ls -la "$RUNNER_TEMP"/firehose-arm64.*
      - uses: actions/upload-artifact@v4
        with:
          name: firehose-android-arm64
          path: |
            ${{ runner.temp }}/firehose-arm64.apk
            ${{ runner.temp }}/firehose-arm64.aab
