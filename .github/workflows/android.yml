name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OTP_TAG: OTP-29.1.2
  NDK_VERSION: 27.2.12479018
  LANG: C.UTF-8

jobs:
  firehose:
    # The acceptance test: the Broadway demo as an APK on an x86_64 emulator
    # (KVM is available on GitHub's Linux runners).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.2"
          elixir-version: "1.20.4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          workspaces: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: liberlang
        with:
          path: ~/liberlang-android/x86_64-linux-android
          key: liberlang-android-x86_64-${{ env.OTP_TAG }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-liberlang-android.sh') }}
      - name: Cross-build OTP for Android
        if: steps.liberlang.outputs.cache-hit != 'true'
        run: |
          scripts/build-liberlang-android.sh "$OTP_TAG" x86_64 ~/liberlang-build
          mkdir -p ~/liberlang-android/x86_64-linux-android
          cp ~/liberlang-build/liberlang.so ~/liberlang-build/erl_child_setup ~/liberlang-android/x86_64-linux-android/
      - name: Build the Firehose APK
        working-directory: examples/broadway
        env:
          BAGUETTE_ANDROID: x86_64
          MIX_ENV: prod
        run: |
          export BAGUETTE_LIBERLANG=$HOME/liberlang-android
          mix local.hex --force && mix local.rebar --force
          mix deps.get
          mix release --overwrite
          cp _build/prod/android/firehose.apk "$RUNNER_TEMP/firehose.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: firehose-apk
          path: ${{ runner.temp }}/firehose.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/android-smoke.sh ${{ runner.temp }}/firehose.apk android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: android-smoke
