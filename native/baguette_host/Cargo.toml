[package]
name = "baguette_host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cdylib` is what Android loads; `rlib` is what the desktop executable uses.
name = "baguette_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Renders with gpui-base's `.test_support()`; see `baguette_view`.
test-support = ["baguette_view/test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-channel = "2"
baguette_abi = { path = "../baguette_abi" }
baguette_view = { path = "../baguette_view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["unstable"] }
# tauri-gpui's main is on gpui-pre =0.3.9, the snapshot gpui-kit 0.7.3 uses.
# Switch to a release once one is published.
tauri-plugin-gpui = { git = "https://github.com/ziinc/tauri-gpui", features = ["mobile"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
flate2 = "1"
libc = "0.2"
log = "0.4"
tar = "0.4"
