[package]
name = "baguette_host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `cdylib` is what Android loads; `rlib` is what the desktop executable and
# iOS (`native/baguette_ios`, a static library Xcode links) use.
name = "baguette_host_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
levain-build = { git = "https://github.com/Ziinc/levain", rev = "d53a3f5943ff17cd6a97f388b89a9280280974af" }

[features]
default = ["components-gpui-kit"]
# Native component sets (levain's `components`), one feature each. A
# release chooses them with `baguette: [components: [...]]`.
components-gpui-kit = ["levain/components-gpui-kit"]
# Serves the app's windows to Playwright clients (gpui-playwright) when
# GPUI_PLAYWRIGHT is set. Test builds only: release builds leave it out.
playwright = ["levain/playwright"]

[dependencies]
# The host is levain running the BEAM (`baguette_beam`).
levain = { git = "https://github.com/Ziinc/levain", rev = "d53a3f5943ff17cd6a97f388b89a9280280974af", default-features = false }
baguette_beam = { path = "../baguette_beam" }
tauri = { version = "2.12", default-features = false }
