[package]
name = "baguette_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `rlib`: on iOS the host links it in (`baguette_host`, `build.rs`).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
levain-abi = { git = "https://github.com/Ziinc/levain", rev = "b11c92a44bd56125a8a960e1b441241d22afb60a" }
rustler = "0.38"
