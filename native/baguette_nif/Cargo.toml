[package]
name = "baguette_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `rlib`: on iOS the host links it in (`baguette_host`, `build.rs`).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
levain-abi = { git = "https://github.com/Ziinc/levain", rev = "7e26ac86ddf3480988043ea73bf948bafb20cde6" }
rustler = "0.38"
