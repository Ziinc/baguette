[package]
name = "baguette_nif"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# `rlib`: on iOS the host links it in (`baguette_host`, `build.rs`).
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
levain-abi = { git = "https://github.com/Ziinc/levain", rev = "268f2c3cc21108f5e9a780b8c02d87bcd8de73fb" }
rustler = "0.38"
