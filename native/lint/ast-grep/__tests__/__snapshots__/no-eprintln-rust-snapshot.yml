id: no-eprintln-rust
snapshots:
  ? |
    fn debug_dumps_a_value(result: &str) {
      eprintln!("resolve result: {:?}", result);
    }
  : labels:
    - source: 'eprintln!("resolve result: {:?}", result)'
      style: primary
      start: 41
      end: 82
  ? |
    fn logs_via_eprintln(class: &str) {
      eprintln!("baguette: unsupported class `{class}`");
    }
  : labels:
    - source: 'eprintln!("baguette: unsupported class `{class}`")'
      style: primary
      start: 38
      end: 88
